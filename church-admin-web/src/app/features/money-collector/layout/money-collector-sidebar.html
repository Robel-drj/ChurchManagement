<aside class="role-sidebar">

  <div class="sidebar-brand">
    <div class="brand-icon">✝</div>
    <div>
      <h2>Church CMS</h2>
      <small>Finance Portal</small>
    </div>
  </div>

  <div class="sidebar-section-title">FINANCE</div>

  <nav class="sidebar-nav">

    <a
      routerLink="/money-collector/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="nav-icon">▦</span>
      <span>Dashboard</span>
    </a>

    <a
      routerLink="/money-collector/contributions"
      routerLinkActive="active"
    >
      <span class="nav-icon">💰</span>
      <span>Contributions</span>
    </a>

    <a
      routerLink="/money-collector/categories"
      routerLinkActive="active"
    >
      <span class="nav-icon">▤</span>
      <span>Contribution Categories</span>
    </a>

    <a
      routerLink="/money-collector/payment-methods"
      routerLinkActive="active"
    >
      <span class="nav-icon">▣</span>
      <span>Payment Methods</span>
    </a>

    <a
      routerLink="/money-collector/reports"
      routerLinkActive="active"
    >
      <span class="nav-icon">▥</span>
      <span>Financial Reports</span>
    </a>

  </nav>

  <div class="sidebar-bottom">

    <a routerLink="/money-collector/profile" routerLinkActive="active">
      <span class="nav-icon">♙</span>
      <span>My Profile</span>
    </a>

    <a routerLink="/login" class="logout-link">
      <span class="nav-icon">↪</span>
      <span>Logout</span>
    </a>

  </div>

</aside>
