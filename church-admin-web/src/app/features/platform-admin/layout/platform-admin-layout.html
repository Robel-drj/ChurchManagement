<div class="admin-layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">C</div>
      <div>
        <strong>Church Platform</strong>
        <span>Administration</span>
      </div>
    </div>

    <div class="sidebar-label">PLATFORM</div>

    <nav class="navigation" aria-label="Platform administration">
      <a
        class="nav-link"
        routerLink="/platform-admin/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon">▦</span>
        Overview
      </a>

      <a
        class="nav-link"
        routerLink="/platform-admin/churches"
        routerLinkActive="active"
      >
        <span class="nav-icon">⌂</span>
        Churches
      </a>

      <a
        class="nav-link"
        routerLink="/platform-admin/invitations"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon">✉</span>
        Invitations
      </a>

      <a
        class="nav-link"
        routerLink="/platform-admin/audit-logs"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon">▤</span>
        Audit Logs
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="admin-profile">
        <div class="avatar">{{ userName.charAt(0).toUpperCase() }}</div>
        <div class="profile-info">
          <strong>{{ userName }}</strong>
          <span>Platform Administrator</span>
        </div>
      </div>

      <button class="logout-button" type="button" (click)="logout()">
        Sign out
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
