<aside class="role-sidebar">

  <div class="sidebar-brand">
    <div class="brand-icon">✝</div>
    <div>
      <h2>Church CMS</h2>
      <small>Content Portal</small>
    </div>
  </div>

  <div class="sidebar-section-title">CONTENT MANAGEMENT</div>

  <nav class="sidebar-nav">

    <a
      routerLink="/content-creator/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="nav-icon">▦</span>
      <span>Dashboard</span>
    </a>

    <a
      routerLink="/content-creator/posts"
      routerLinkActive="active"
    >
      <span class="nav-icon">▤</span>
      <span>Posts & Announcements</span>
    </a>

    <a
      routerLink="/content-creator/events"
      routerLinkActive="active"
    >
      <span class="nav-icon">▣</span>
      <span>Events</span>
    </a>

    <a
      routerLink="/content-creator/media"
      routerLinkActive="active"
    >
      <span class="nav-icon">▧</span>
      <span>Media Library</span>
    </a>

  </nav>

  <div class="sidebar-bottom">

    <a routerLink="/content-creator/profile" routerLinkActive="active">
      <span class="nav-icon">♙</span>
      <span>My Profile</span>
    </a>

    <a routerLink="/login" class="logout-link">
      <span class="nav-icon">↪</span>
      <span>Logout</span>
    </a>

  </div>

</aside>
